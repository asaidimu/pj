name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: POSIX shell tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [sh, bash, zsh, dash, ksh]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y dash ksh zsh

      - name: Run tests under ${{ matrix.shell }}
        run: sh tests/run.sh ${{ matrix.shell }}
